name: Helm CI/CD

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'latest'

      - name: Lint Helm Chart
        run: helm lint .

      - name: Validate Helm Templates
        run: helm template . --debug --dry-run

      - name: Setup kubeconform
        uses: bmuschko/setup-kubeconform@e5d264ec1eafe2314e750c429a9da7639dd5a003 # v1.1.0

      - name: Validate with kubeconform
        run: |
          for version in 1.28.0 1.29.0 1.30.0 1.31.0; do
            echo "=== Validating against Kubernetes $version ==="
            helm template . | kubeconform \
              -kubernetes-version "$version" \
              -strict \
              -summary
          done

      - name: Package Helm chart
        run: |
          helm package ./ --destination ./packaged-charts/
          echo "Packaged chart:"
          ls -lh ./packaged-charts/
